name: Build Input Buffer

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Android64
          os: ubuntu-latest
          target: Android64

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: iOS
          os: macos-latest
          target: iOS

        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          sdk: given
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    if: ${{ !cancelled() }}

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: angel.input-buffer
          path: ${{ steps.build.outputs.build-output }}
